name: Debug - Lookup listing

on:
  workflow_dispatch:
    inputs:
      listing_id:
        description: "UUID du listing BuyBack à inspecter"
        required: true

jobs:
  lookup:
    runs-on: ubuntu-latest
    env:
      BM_API_KEY: ${{ secrets.BM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: pip install certifi
      - name: Dump JSON brut de l'API competitors
        env:
          LISTING_ID: ${{ inputs.listing_id }}
        run: |
          python3 - <<'PYEOF'
          import json, os, ssl, urllib.request
          import certifi

          api_key = os.environ["BM_API_KEY"]
          listing_id = os.environ["LISTING_ID"]
          ctx = ssl.create_default_context(cafile=certifi.where())

          def fetch(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Basic {api_key}",
                  "Accept": "application/json",
                  "User-Agent": "curl/8.7.1",
              })
              with urllib.request.urlopen(req, timeout=30, context=ctx) as resp:
                  return json.loads(resp.read().decode("utf-8"))

          data = fetch(f"https://www.backmarket.fr/ws/buyback/v1/competitors/{listing_id}")
          print(json.dumps(data, indent=2, ensure_ascii=False))
          print("--- clés présentes sur chaque entrée ---")
          for e in data:
              print(e["market"], "is_winning=", e["is_winning"], "clés:", sorted(e.keys()))
          PYEOF
