name: Debug - Verifier statut live

on:
  workflow_dispatch:
    inputs:
      listing_id:
        required: true
      market:
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      BM_API_KEY: ${{ secrets.BM_API_KEY }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: pip install certifi
      - name: Vérifier le statut live
        env:
          LISTING_ID: ${{ inputs.listing_id }}
          MARKET: ${{ inputs.market }}
        run: |
          python3 - <<'PYEOF'
          import json, os, ssl, urllib.request
          import certifi
          api_key = os.environ["BM_API_KEY"]
          listing_id = os.environ["LISTING_ID"]
          market = os.environ["MARKET"]
          ctx = ssl.create_default_context(cafile=certifi.where())
          req = urllib.request.Request(
              f"https://www.backmarket.fr/ws/buyback/v1/competitors/{listing_id}",
              headers={"Authorization": f"Basic {api_key}", "Accept": "application/json", "User-Agent": "curl/8.7.1"},
          )
          with urllib.request.urlopen(req, timeout=30, context=ctx) as resp:
              data = json.loads(resp.read().decode("utf-8"))
          for e in data:
              if e["market"] == market:
                  print(json.dumps(e, indent=2, ensure_ascii=False))
          PYEOF
