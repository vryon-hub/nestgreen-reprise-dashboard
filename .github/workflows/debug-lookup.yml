name: Debug - Lookup listing

on:
  workflow_dispatch:
    inputs:
      listing_id:
        description: "UUID du listing BuyBack à inspecter"
        required: true

jobs:
  lookup:
    runs-on: ubuntu-latest
    env:
      BM_API_KEY: ${{ secrets.BM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: pip install certifi
      - name: Chercher le listing et son statut concurrentiel
        env:
          LISTING_ID: ${{ inputs.listing_id }}
        run: |
          python3 - <<'PYEOF'
          import json, os, ssl, urllib.request
          import certifi

          api_key = os.environ["BM_API_KEY"]
          listing_id = os.environ["LISTING_ID"]
          ctx = ssl.create_default_context(cafile=certifi.where())

          def fetch(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Basic {api_key}",
                  "Accept": "application/json",
                  "User-Agent": "curl/8.7.1",
              })
              with urllib.request.urlopen(req, timeout=30, context=ctx) as resp:
                  return json.loads(resp.read().decode("utf-8"))

          found = None
          url = "https://www.backmarket.fr/ws/buyback/v1/listings?pageSize=100"
          while url:
              data = fetch(url)
              for listing in data["results"]:
                  if listing["id"] == listing_id:
                      found = listing
                      break
              if found:
                  break
              url = data.get("next")

          if not found:
              print(f"Listing {listing_id} introuvable dans les {len(data.get('results', []))} listings du compte.")
          else:
              print(f"Listing trouvé : sku={found.get('sku')} productId={found.get('productId')} grade={found.get('aestheticGradeCode')}")
              print(f"Mes prix : {found.get('prices')}")

          competitors = fetch(f"https://www.backmarket.fr/ws/buyback/v1/competitors/{listing_id}")
          print("Statut concurrentiel par marché :")
          for e in competitors:
              print(f"  {e['market']}: mon_prix={e['price']['amount']} price_to_win={e['price_to_win']['amount']} je_gagne={e['is_winning']}")
          PYEOF
