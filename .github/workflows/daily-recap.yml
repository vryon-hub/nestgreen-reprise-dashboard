name: Recap emails (quotidien, hebdo, mensuel)

on:
  schedule:
    # 22:30 UTC = 00:30 Paris l'été (CEST), 23:30 UTC = 00:30 Paris l'hiver (CET).
    # On déclenche aux DEUX horaires : le premier qui tombe après minuit (Paris) envoie,
    # l'autre est neutralisé par le contrôle de doublon (alert_state.json) -> plus
    # d'ajustement manuel aux changements d'heure.
    - cron: '30 22,23 * * *'
  workflow_dispatch:
    inputs:
      preview:
        description: "Aperçu envoyé à v.ryon SEUL, sans toucher à l'état : daily, weekly ou monthly — vide = envoi normal"
        required: false
        default: ""

concurrency:
  group: daily-recap
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  recap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Envoyer le récapitulatif de la veille
        if: ${{ inputs.preview == '' }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 send_daily_recap.py

      - name: Envoyer les récaps hebdo / mensuel (si une semaine ou un mois vient de se terminer)
        if: ${{ !cancelled() && inputs.preview == '' }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 send_period_recap.py

      - name: Envoyer un aperçu (v.ryon uniquement)
        if: ${{ inputs.preview != '' }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PREVIEW: ${{ inputs.preview }}
        run: python3 send_period_recap.py --preview "$PREVIEW"

      - name: Committer l'état d'alerte si changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alert_state.json
          git diff --staged --quiet && echo "Rien à committer" || git commit -m "auto: recap envoyé $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "push refusé (tentative $i) -> abandon du rebase avant retry dans 10s..."
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "::error::Échec du push après 5 tentatives (conflit de rebase non résolu) — alert_state.json pas à jour (le mail est déjà parti)."
          exit 1
