name: Daily recap email

on:
  schedule:
    # 22:30 UTC = 00:30 heure de Paris (CEST, été). GitHub Actions ne suit pas
    # le changement d'heure : en hiver (CET, UTC+1) ça tombera à 23:30 Paris
    # au lieu de 00:30 -> à ajuster manuellement si besoin en octobre/mars.
    - cron: '30 22 * * *'
  workflow_dispatch: {}

concurrency:
  group: daily-recap
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  recap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Envoyer le récapitulatif de la veille
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 send_daily_recap.py

      - name: Committer l'état d'alerte si changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alert_state.json
          git diff --staged --quiet && echo "Rien à committer" || git commit -m "auto: recap envoyé $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push
