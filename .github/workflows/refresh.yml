name: Refresh dashboard

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # ref: main = dernière version AU DÉMARRAGE du job. Sans ça, GitHub extrait le commit du
      # moment du déclenchement : un run resté en file d'attente travaillerait sur du code périmé
      # puis entrerait en conflit au push (constaté le 20/11/2026).
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: pip install certifi

      - name: Rafraîchir les données et reconstruire le dashboard
        env:
          BM_API_KEY: ${{ secrets.BM_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: bash refresh_cloud.sh

      - name: Committer et pousser les fichiers mis à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "Rien à committer" || git commit -m "auto: refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "push refusé (tentative $i) -> abandon du rebase avant retry dans 10s..."
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "::error::Échec du push après 5 tentatives (conflit de rebase non résolu) — ce cycle n'a rien mis à jour."
          exit 1
